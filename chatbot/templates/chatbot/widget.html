{% load static %}
<style>
  #cb-toggle {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(29,78,216,0.35);
    z-index: 9998;
    transition: transform .2s, box-shadow .2s;
    text-decoration: none;
    color: white;
    font-size: 24px;
  }
  #cb-toggle:hover {
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 12px 32px rgba(29,78,216,0.45);
  }
  #cb-badge {
    position: absolute;
    top: 0; right: 0;
    width: 14px; height: 14px;
    background: #22c55e;
    border-radius: 50%;
    border: 2px solid white;
    animation: cb-pulse 2s infinite;
  }
  @keyframes cb-pulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }
  #cb-tooltip {
    position: fixed;
    bottom: 96px;
    right: 28px;
    background: white;
    border: 1.5px solid #e0e7ff;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 13px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #1e293b;
    box-shadow: 0 8px 24px rgba(29,78,216,0.12);
    z-index: 9997;
    white-space: nowrap;
    animation: tooltip-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
    border-left: 3px solid #1d4ed8;
  }
  #cb-tooltip::after {
    content: '';
    position: absolute;
    bottom: -8px; right: 20px;
    width: 14px; height: 14px;
    background: white;
    border-right: 1.5px solid #e0e7ff;
    border-bottom: 1.5px solid #e0e7ff;
    transform: rotate(45deg);
  }
  @keyframes tooltip-in {
    from { opacity: 0; transform: translateY(8px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>

<!-- Tooltip -->
<div id="cb-tooltip" style="display:none;">
  🤖 Besoin d'aide ? Je suis là !
</div>

<!-- Bouton flottant -->
<a id="cb-toggle" href="{% url 'chatbot_page' %}" title="Assistant IA">
  <span id="cb-badge"></span>
  🤖
</a>

<script>
// Afficher le tooltip après 4 secondes
setTimeout(() => {
  const tooltip = document.getElementById('cb-tooltip');
  tooltip.style.display = 'block';
  setTimeout(() => { tooltip.style.display = 'none'; }, 5000);
}, 4000);
</script>
