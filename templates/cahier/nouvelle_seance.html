{% extends 'base.html' %}
{% block titre %}Nouvelle séance — UFR SI{% endblock %}
{% block contenu %}
<h2 class="mb-4"><i class="bi bi-plus-circle"></i> Ajouter une séance</h2>
<div class="card p-4">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Cours</label>
      <select name="cours" class="form-select" required>
        <option value="">-- Choisir un cours --</option>
        {% for cour in cours_list %}
        <option value="{{ cour.id }}">{{ cour.nom }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Date de la séance</label>
      <input type="date" name="date" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Contenu / Résumé</label>
      <textarea name="contenu" class="form-control" rows="5"
        placeholder="Décrivez le contenu de la séance..."></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Documents (PDF, images...)</label>
      <input type="file" name="fichiers" class="form-control" multiple>
    </div>
    <hr>
    <h5><i class="bi bi-geo-alt"></i> Localisation terrain (optionnel)</h5>
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Latitude</label>
        <input type="text" name="latitude" id="latitude" class="form-control"
          placeholder="Ex: 14.6928">
      </div>
      <div class="col-md-6">
        <label class="form-label">Longitude</label>
        <input type="text" name="longitude" id="longitude" class="form-control"
          placeholder="Ex: -17.4467">
      </div>
    </div>
    <div id="map" style="height:250px; border-radius:12px;" class="mb-3"></div>
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-check-circle"></i> Enregistrer la séance
    </button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([14.6928, -17.4467], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  var marker;
  map.on('click', function(e) {
    if (marker) map.removeLayer(marker);
    marker = L.marker(e.latlng).addTo(map);
    document.getElementById('latitude').value = e.latlng.lat.toFixed(6);
    document.getElementById('longitude').value = e.latlng.lng.toFixed(6);
  });
</script>
{% endblock %}
