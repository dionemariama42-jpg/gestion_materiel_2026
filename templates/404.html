<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — UFR SI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f0f5ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container-404 {
      text-align: center;
      max-width: 520px;
    }

    .number {
      font-size: clamp(100px, 20vw, 180px);
      font-weight: 800;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }

    .icon-wrap {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      color: white;
      box-shadow: 0 8px 24px rgba(29,78,216,0.3);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn-home {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white;
      padding: 13px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(29,78,216,0.3);
      transition: all 0.2s;
      border: none;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(29,78,216,0.4);
      color: white;
    }

    .btn-back {
      background: white;
      color: #1d4ed8;
      padding: 13px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid #e0e7ff;
      transition: all 0.2s;
      margin-left: 12px;
    }

    .btn-back:hover {
      background: #eff6ff;
      color: #1d4ed8;
      transform: translateY(-2px);
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #c7d2fe;
    }
    .dot:nth-child(2) { background: #93c5fd; }
    .dot:nth-child(3) { background: #3b82f6; }
  </style>
</head>
<body>
  <div class="container-404">
    <div class="icon-wrap">
      <i class="bi bi-map"></i>
    </div>
    <div class="number">404</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <h1>Page introuvable</h1>
    <p>
      La page que vous cherchez n'existe pas ou a été déplacée.<br>
      Vérifiez l'URL ou retournez à l'accueil.
    </p>
    <div>
      <a href="/" class="btn-home">
        <i class="bi bi-house"></i> Retour à l'accueil
      </a>
      <a href="javascript:history.back()" class="btn-back">
        <i class="bi bi-arrow-left"></i> Page précédente
      </a>
    </div>
  </div>
</body>
</html>
