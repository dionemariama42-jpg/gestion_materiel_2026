<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erreur serveur — UFR SI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #fff5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container-500 {
      text-align: center;
      max-width: 520px;
    }

    .number {
      font-size: clamp(100px, 20vw, 180px);
      font-weight: 800;
      background: linear-gradient(135deg, #b91c1c, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }

    .icon-wrap {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #b91c1c, #ef4444);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      color: white;
      box-shadow: 0 8px 24px rgba(220,38,38,0.3);
      animation: shake 0.5s ease 1s both;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn-home {
      background: linear-gradient(135deg, #b91c1c, #ef4444);
      color: white;
      padding: 13px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(220,38,38,0.3);
      transition: all 0.2s;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(220,38,38,0.4);
      color: white;
    }

    .btn-retry {
      background: white;
      color: #dc2626;
      padding: 13px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid #fecaca;
      transition: all 0.2s;
      margin-left: 12px;
      cursor: pointer;
    }

    .btn-retry:hover {
      background: #fef2f2;
      color: #dc2626;
      transform: translateY(-2px);
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fecaca;
      animation: blink 1.4s infinite;
    }
    .dot:nth-child(2) { background: #fca5a5; animation-delay: 0.2s; }
    .dot:nth-child(3) { background: #ef4444; animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 1; }
      40% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container-500">
    <div class="icon-wrap">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <div class="number">500</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <h1>Erreur interne du serveur</h1>
    <p>
      Une erreur inattendue s'est produite sur le serveur.<br>
      Notre équipe a été notifiée. Veuillez réessayer dans quelques instants.
    </p>
    <div>
      <a href="/" class="btn-home">
        <i class="bi bi-house"></i> Retour à l'accueil
      </a>
      <button onclick="location.reload()" class="btn-retry">
        <i class="bi bi-arrow-clockwise"></i> Réessayer
      </button>
    </div>
  </div>
</body>
</html>
