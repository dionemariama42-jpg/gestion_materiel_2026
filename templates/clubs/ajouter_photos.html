{% extends 'base.html' %}
{% block titre %}Ajouter photos — UFR SI{% endblock %}
{% block contenu %}
<h2 class="mb-4"><i class="bi bi-images"></i> Ajouter des photos</h2>
<div class="card p-4">
  <h5>Activité : {{ activite.titre }}</h5>
  <hr>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Photos</label>
      <input type="file" name="photos" class="form-control" multiple accept="image/*">
      <small class="text-muted">Vous pouvez sélectionner plusieurs photos</small>
    </div>
    <div class="mb-3">
      <label class="form-label">Légende (optionnel)</label>
      <input type="text" name="legende" class="form-control" placeholder="Ex: Discours d'ouverture">
    </div>
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-upload"></i> Ajouter les photos
    </button>
  </form>
</div>
{% endblock %}
